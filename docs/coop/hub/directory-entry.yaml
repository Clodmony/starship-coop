  coop_scope:
    players_visible: yes
    story: partial
    enemies: yes
    world_state: yes
    items: per-player
  players: "2 played; the code supports up to 4, three clients run in scripted tests"
  networking: direct-ip
  open_source: yes
  last_activity: 2026-11
  qa: automated
  notes: Campaign co-op for the Starship PC port, lockstep with a state hash compared on every frame. Two people played
    the whole campaign online on two PCs, a Windows host and a Linux joining player over a direct connection with a VPN
    (Corneria to the ending, 66 minutes, 2026-11-09 and 2026-11-10); later sessions found two faults that only two PCs
    show, both fixed (the map read each PC's own save, an Aquas enemy read memory outside an array that the two
    compilers lay out differently). Scripted two-client runs and a 52-step test gate pass on Linux. Players share the
    level, enemies, bosses and path; items go to the player who takes them and the team shares lives and gold rings;
    cutscenes and radio follow the host. No release or download yet, you build from source with your own ROM. When the
    host's ship goes down the level restarts for both, and a desync ends the session; both have fixes decided or in
    progress. License CC0 1.0.
