# State of 2026-11-11, after the merge of PR #263 (coop a4867d99). The QA level follows docs/coop/QA.md ("automated"):
# the hand-played campaign is named in the notes, and claiming `verified-playthrough` is the owner's call.
- game: Star Fox 64
  year: 1997
  engine: N64 decompilation port (Starship, libultraship)
  project: Starship Co-op
  url: https://github.com/Clodmony/starship-coop
  other_urls:
  - https://github.com/HarbourMasters/Starship
  kind: fork
  status: alpha
  coop_scope:
    players_visible: yes
    story: partial
    enemies: yes
    world_state: yes
    items: per-player
  players: "2 played; up to 4 in the code, 3 in scripted network tests"
  networking: direct-ip
  open_source: yes
  last_activity: 2026-11
  qa: automated
  notes: Online campaign co-op for the Starship PC port, each player on their own PC. Deterministic lockstep (inputs
    over UDP, 3 frames of input delay) with a state hash compared on every frame and a desync report. On 2026-11-09
    and 2026-11-10 two people, a Windows host and a Linux joining player on a direct connection over a VPN, played
    one route from Corneria to the ending in 66 minutes with no desync; later sessions found two more faults, both
    fixed, the second not yet replayed on two PCs, and the code merged on 2026-11-11 has not been played by hand.
    In scripted runs on one Linux PC a 52-step test gate passes on the merged code, and on the build before it 12 of
    the 17 levels stayed equal from start to end with two clients (the test pilot cannot beat the other five bosses).
    Players share the level, enemies, bosses and path; items go to the player who takes them, the team shares lives
    and gold rings, and the host steers the route, cutscenes and radio. No release or download, you build from source
    with your own US ROM. When the host's ship goes down the level restarts for both, a desync or a lost player ends
    the session, and what a session earns is not saved. The project calls itself pre-alpha. License CC0 1.0.
